        var theme = ['light', 'dark', 'sepia'].indexOf(savedTheme) !== -1
          ? savedTheme
          : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: light;
      --page-solid: #f7faf7;
      --page-background: radial-gradient(circle at 50% 30%, rgba(255, 241, 242, 0.68) 0%, rgba(241, 237, 255, 0.74) 48%, rgba(248, 250, 252, 0.82) 100%);
      --page-foreground: #332742;
      --page-muted: #64748b;
      --page-surface: rgba(255, 255, 255, 0.78);
      --page-surface-hover: rgba(255, 255, 255, 0.96);
      --page-border: rgba(51, 39, 66, 0.12);
      --page-accent: #6d3c88;
      --page-accent-border: rgba(139, 92, 246, 0.28);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --page-solid: #0b0a10;
      --page-background: radial-gradient(circle at 50% 30%, rgba(36, 27, 46, 0.68) 0%, rgba(21, 18, 29, 0.76) 58%, rgba(11, 10, 16, 0.84) 100%);
      --page-foreground: #f1f0f5;
      --page-muted: #a7a1b2;
      --page-surface: rgba(30, 27, 46, 0.84);
      --page-surface-hover: rgba(48, 41, 69, 0.96);
      --page-border: rgba(255, 255, 255, 0.13);
      --page-accent: #d8b4fe;
      --page-accent-border: rgba(167, 139, 250, 0.34);
    }

    html[data-theme="sepia"] {
      --page-solid: #f5ead6;
      --page-background: radial-gradient(circle at 50% 30%, rgba(255, 244, 227, 0.7) 0%, rgba(243, 232, 213, 0.76) 50%, rgba(238, 227, 209, 0.84) 100%);
      --page-foreground: #3e2d20;
      --page-muted: #74604e;
      --page-surface: rgba(255, 250, 240, 0.84);
      --page-surface-hover: rgba(255, 252, 246, 0.98);
      --page-border: rgba(62, 45, 32, 0.16);
      --page-accent: #8b4c63;
      --page-accent-border: rgba(139, 76, 99, 0.3);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      position: relative;
      isolation: isolate;
      background-color: var(--page-solid);
      color: var(--page-foreground);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: 0;
      background: var(--page-background);
      pointer-events: none;
    }

    .heart-page-background-video {
      position: fixed;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.58;
      filter: blur(1.5px) saturate(0.72) brightness(0.82);
      pointer-events: none;
    }

    header.top-nav {
      width: 100%;
      max-width: 900px;
      padding: max(16px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 16px max(24px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: var(--page-surface);
      backdrop-filter: blur(8px);
      border: 1px solid var(--page-border);
      color: var(--page-foreground);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s;
    }

    .back-btn:hover {
      transform: translateX(-2px);
      background: var(--page-surface-hover);
    }

    .back-btn:focus-visible,
    .control-btn:focus-visible {
      outline: 3px solid var(--page-accent);
      outline-offset: 3px;
    }

    main#emoji-app {
      flex: 1;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 48px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--page-accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 46px);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 10px 0 20px;
      color: var(--page-muted);
      font-size: 16px;
      max-width: 380px;
    }

    .control-btn {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      padding: 13px 24px;
      margin-top: 18px;
      border: 1px solid var(--page-accent-border);
      border-radius: 999px;
      background: var(--page-surface);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(80, 52, 112, 0.1);
      color: var(--page-accent);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .control-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(80, 52, 112, 0.18);
    }

    .control-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    footer.site-footer {
      width: 100%;
      max-width: 900px;
      padding: 24px;
      font-size: 13px;
      color: var(--page-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--page-border);
    }

    footer.site-footer a {
      color: inherit;
      text-decoration: underline;
      margin-left: 12px;
    }

    @media (max-width: 520px) {
      header.top-nav {
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }

      .back-btn {
        gap: 6px;
        padding: 8px 12px;
        font-size: 13px;
      }

      main#emoji-app {
        padding: 16px 16px 32px;
      }

      footer.site-footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 18px max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }

      footer.site-footer nav {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      footer.site-footer a {
        margin-left: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .back-btn,
      .control-btn {
        transition: none;
      }

      .heart-page-background-video {
        display: none;
      }

      .back-btn:hover,
      .control-btn:hover {
        transform: none;
      }
    }
  </style>

          <path d="M20 122h12m33 0h12m33 0h12m33 0h12m33 0h12M20 143h12m33 0h12m33 0h12m33 0h12m33 0h12"

    <button id="animation-toggle" class="control-btn" type="button">
      <span id="btn-icon" aria-hidden="true">
        <!-- Pause Icon -->
        <svg viewBox="0 0 24 24">
          <rect x="6" y="4" width="4" height="16" rx="1"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1"></rect>
        </svg>
      </span>
      <span id="toggle-label" aria-live="polite" aria-atomic="true">Pause animation</span>

  <script>
    (function () {
      const toggle = document.getElementById('animation-toggle');
      const label = document.getElementById('toggle-label');
      const iconSpan = document.getElementById('btn-icon');
      const app = document.getElementById('emoji-app');
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const pauseIconSvg = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>';
      const playIconSvg = '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';

      function setPaused(isPaused) {
        app.classList.toggle('paused', isPaused);
        app.classList.toggle('motion-enabled', reduceMotion && !isPaused);
        label.textContent = isPaused ? 'Play animation' : 'Pause animation';
        iconSpan.innerHTML = isPaused ? playIconSvg : pauseIconSvg;
      }

      if (reduceMotion) setPaused(true);

      toggle.addEventListener('click', function () {
        setPaused(!app.classList.contains('paused'));
      });
    })();
  </script>
