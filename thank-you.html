<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="heynuo-build" content="2026-11-15-gratitude-4">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7faf7">
  <title>Thank You, Allah | Shukriya</title>
  <meta name="description"
    content="For every blessing, seen and unseen — every breath, every heartbeat, and the mercy that embraces all things.">
  <link rel="canonical" href="https://heynuo.github.io/thank-you.html">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph -->
  <meta property="og:title" content="Thank You, Allah | Shukriya">
  <meta property="og:description"
    content="For every blessing, seen and unseen — every breath, every heartbeat, and the mercy that embraces all things.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://heynuo.github.io/thank-you.html">
  <meta property="og:image" content="https://heynuo.github.io/assets/banners/og-banner.jpg">

  <!-- Fonts: Amiri for sacred calligraphy, Inter for UI, Playfair Display for titles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
    rel="stylesheet">

  <!-- Separated, high-performance, cacheable stylesheet -->
  <link rel="stylesheet" href="css/thank-you.css">
</head>

<body>
  <!-- Ambient Stars & Glow Dust Particles -->
  <canvas id="stars-canvas" aria-hidden="true"></canvas>

  <!-- Living Atmosphere Video Layer (for standalone immersive mode) -->
  <div id="atmosphere-video-layer" aria-hidden="true">
    <video id="atmosphere-video" muted playsinline loop preload="none"></video>
    <div id="atmosphere-scrim"></div>
  </div>

  <!-- Top Standalone Header (Auto-hidden when embedded in iframe) -->
  <header class="sanctuary-header" role="banner">
    <a href="index.html" class="brand-link" title="Return to Ruqyah.io Homepage">
      <span class="brand-icon" aria-hidden="true"><span class="brand-icon-inner"></span></span>
      <span class="brand-title">Ruqyah.io</span>
    </a>

    <div class="header-controls">
      <!-- Sacred Chimes Audio -->
      <button type="button" class="chip-btn" id="audioToggleBtn" title="Toggle Sanctuary Chimes" aria-label="Toggle sanctuary audio chimes">
        <span id="audioIcon" aria-hidden="true">🔕</span>
        <span class="label-desktop" id="audioLabel">Chimes</span>
      </button>

      <!-- Theme Switcher -->
      <button type="button" class="chip-btn" id="themeToggleBtn" title="Cycle Theme (Light / Sepia / Dark)" aria-label="Cycle theme">
        <span id="themeIcon" aria-hidden="true">☀️</span>
        <span class="label-desktop" id="themeLabel">Theme</span>
      </button>

      <!-- Fullscreen Toggle -->
      <button type="button" class="chip-btn" id="fullscreenToggleBtn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
        <span aria-hidden="true">⛶</span>
      </button>
    </div>
  </header>

  <!-- Embedded Expand Action (Visible only when in iframe) -->
  <a href="thank-you.html" target="_top" class="embed-expand-btn" title="Open full gratitude sanctuary in new view" aria-label="Open full gratitude sanctuary">
    <span class="expand-icon" aria-hidden="true">⤢</span>
    <span class="expand-label">Full Sanctuary</span>
  </a>

  <!-- Main Devotional Sanctuary -->
  <main aria-labelledby="gratitude-title">
    <section class="gratitude-message" aria-label="A message of gratitude">
      <!-- Sacred Arabic Calligraphy -->
      <div class="gratitude-arabic" dir="rtl" lang="ar" aria-label="Al-Hamdu Lillahi Rabbi l-Alameen — All Praise is due to Allah, Lord of all the worlds">
        الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ
      </div>

      <!-- Kicker -->
      <p class="gratitude-kicker video-fill" data-video-fill>A moment of gratitude</p>

      <!-- Grand Masked Title -->
      <h1 id="gratitude-title" class="video-fill" data-video-fill>Thank You, Allah</h1>

      <!-- Sacred Divider -->
      <div class="gratitude-divider" aria-hidden="true">
        <span class="gem">✦</span>
      </div>

      <!-- Islamic Expressions of Gratitude -->
      <p class="gratitude-word">
        Alhamdulillah <span class="sep">•</span> Shukriya <span class="sep">•</span> Ash-Shukru Lillah
      </p>

      <!-- Poetic Reflection Note -->
      <p class="gratitude-note">
        For every blessing, seen and unseen — every breath, every heartbeat, and the mercy that embraces all things.
      </p>

      <!-- Interactive "Say Alhamdulillah" Tap Button -->
      <div class="gratitude-action-area">
        <button type="button" class="dhikr-tap-btn" id="sayAlhamdulillahBtn" aria-label="Say Alhamdulillah and offer gratitude">
          <span aria-hidden="true">🤍</span>
          <span>Say Alhamdulillah</span>
          <span class="dhikr-badge" id="gratitudeCounter">0</span>
        </button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      // ── 1. Embedded vs Standalone Detection ──────────────────
      var isEmbedded = false;
      try {
        isEmbedded = window.self !== window.top;
      } catch (e) {
        isEmbedded = true;
      }

      if (isEmbedded) {
        document.documentElement.classList.add('is-embedded');
        document.body.classList.add('is-embedded');

        var syncEmbeddedHeight = function () {
          var scrollH = Math.ceil(document.body.scrollHeight || document.documentElement.scrollHeight || 0);
          if (scrollH > 100) {
            try {
              window.parent.postMessage({
                type: 'ruqyah-iframe-resize',
                frame: 'thank-you',
                height: scrollH
              }, '*');
            } catch (e) { }
          }
        };
        window.addEventListener('load', syncEmbeddedHeight);
        window.addEventListener('resize', syncEmbeddedHeight);
        if (typeof ResizeObserver !== 'undefined' && document.body) {
          try {
            var ro = new ResizeObserver(function () {
              syncEmbeddedHeight();
            });
            ro.observe(document.body);
          } catch (e) { }
        }
        setTimeout(syncEmbeddedHeight, 150);
        setTimeout(syncEmbeddedHeight, 500);
      } else {
        document.documentElement.classList.add('is-standalone');
        document.body.classList.add('is-standalone');
      }

      // ── 2. Theme Management ──────────────────────────────────
      var VALID_THEMES = ['light', 'sepia', 'dark'];

      function getParentTheme() {
        if (!isEmbedded) return null;
        try {
          if (window.parent && window.parent.document && window.parent.document.documentElement) {
            return window.parent.document.documentElement.getAttribute('data-theme');
          }
        } catch (e) { /* Cross-origin fallback */ }
        return null;
      }

      function currentTheme() {
        var parentTheme = getParentTheme();
        if (parentTheme && VALID_THEMES.indexOf(parentTheme) >= 0) return parentTheme;
        try {
          var saved = localStorage.getItem('heynuo-theme');
          if (saved && VALID_THEMES.indexOf(saved) >= 0) return saved;
        } catch (e) { /* noop */ }

        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          return 'dark';
        }
        return 'light';
      }

      function updateThemeUI(theme) {
        var themeIcon = document.getElementById('themeIcon');
        var themeLabel = document.getElementById('themeLabel');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var colors = { light: '#f8faf8', sepia: '#f6efe2', dark: '#030807' };

        if (themeMeta) themeMeta.setAttribute('content', colors[theme] || '#f8faf8');
        if (themeIcon) {
          if (theme === 'dark') themeIcon.textContent = '🌙';
          else if (theme === 'sepia') themeIcon.textContent = '📜';
          else themeIcon.textContent = '☀️';
        }
        if (themeLabel) {
          themeLabel.textContent = theme.charAt(0).toUpperCase() + theme.slice(1);
        }
      }

      function applyTheme(theme) {
        if (!theme || VALID_THEMES.indexOf(theme) < 0) theme = currentTheme();
        document.documentElement.setAttribute('data-theme', theme);
        try { localStorage.setItem('heynuo-theme', theme); } catch (e) { }
        updateThemeUI(theme);
      }

      applyTheme();

      // Sync theme with parent window observer if embedded
      if (isEmbedded) {
        try {
          if (window.parent && window.parent.document) {
            new MutationObserver(function () {
              applyTheme(getParentTheme());
            }).observe(window.parent.document.documentElement, {
              attributes: true,
              attributeFilter: ['data-theme']
            });
          }
        } catch (e) { }
      }

      window.addEventListener('storage', function (e) {
        if (e.key === 'heynuo-theme' && e.newValue) applyTheme(e.newValue);
      });

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'heynuo-theme-change' && e.data.theme) {
          applyTheme(e.data.theme);
        }
      });

      // ── 3. Web Audio Synthesized Sacred Chimes ────────────────
      var audioCtx = null;
      var isAudioActive = false;
      var audioDroneOsc1 = null;
      var audioDroneOsc2 = null;
      var audioGainNode = null;

      function initAudioContext() {
        if (audioCtx) return;
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }

      function playSacredChime(freq, decay) {
        if (!isAudioActive) return;
        try {
          initAudioContext();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          var now = audioCtx.currentTime;
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq || 528, now);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.18, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + (decay || 2.4));

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + (decay || 2.4) + 0.1);
        } catch (e) { }
      }

      function startAmbientDrone() {
        try {
          initAudioContext();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          var now = audioCtx.currentTime;
          audioDroneOsc1 = audioCtx.createOscillator();
          audioDroneOsc2 = audioCtx.createOscillator();
          audioGainNode = audioCtx.createGain();

          audioDroneOsc1.type = 'sine';
          audioDroneOsc1.frequency.setValueAtTime(108, now); // A2 drone

          audioDroneOsc2.type = 'sine';
          audioDroneOsc2.frequency.setValueAtTime(162, now); // E3 perfect fifth

          audioGainNode.gain.setValueAtTime(0.0001, now);
          audioGainNode.gain.exponentialRampToValueAtTime(0.05, now + 3);

          audioDroneOsc1.connect(audioGainNode);
          audioDroneOsc2.connect(audioGainNode);
          audioGainNode.connect(audioCtx.destination);

          audioDroneOsc1.start(now);
          audioDroneOsc2.start(now);
        } catch (e) { }
      }

      function stopAmbientDrone() {
        if (!audioCtx || !audioGainNode) return;
        try {
          var now = audioCtx.currentTime;
          audioGainNode.gain.linearRampToValueAtTime(0.0001, now + 1.2);
          setTimeout(function () {
            if (audioDroneOsc1) { audioDroneOsc1.stop(); audioDroneOsc1.disconnect(); audioDroneOsc1 = null; }
            if (audioDroneOsc2) { audioDroneOsc2.stop(); audioDroneOsc2.disconnect(); audioDroneOsc2 = null; }
          }, 1400);
        } catch (e) { }
      }

      function toggleAudio() {
        isAudioActive = !isAudioActive;
        var btn = document.getElementById('audioToggleBtn');
        var icon = document.getElementById('audioIcon');
        var label = document.getElementById('audioLabel');

        if (btn) btn.classList.toggle('active', isAudioActive);

        if (isAudioActive) {
          if (icon) icon.textContent = '🔔';
          if (label) label.textContent = 'Mute';
          startAmbientDrone();
          playSacredChime(432, 3.2);
        } else {
          if (icon) icon.textContent = '🔕';
          if (label) label.textContent = 'Chimes';
          stopAmbientDrone();
        }
      }

      // ── 4. Interactive "Say Alhamdulillah" Counter ────────────
      var gratitudeCount = 0;
      try {
        gratitudeCount = parseInt(localStorage.getItem('heynuo-gratitude-count') || '0', 10);
      } catch (e) {
        gratitudeCount = 0;
      }

      var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      function spawnGratitudeParticle(originX, originY) {
        if (prefersReducedMotion.matches) return;
        var symbols = ['✦', '✨', '🤍', '✧', '⋆', '🕊️'];
        var count = 5 + Math.floor(Math.random() * 4);

        for (var i = 0; i < count; i++) {
          var p = document.createElement('span');
          p.className = 'spark-particle';
          p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          p.style.left = (originX + (Math.random() * 40 - 20)) + 'px';
          p.style.top = (originY + (Math.random() * 30 - 15)) + 'px';
          p.style.setProperty('--dx', (Math.random() * 90 - 45) + 'px');
          p.style.setProperty('--dx2', (Math.random() * 140 - 70) + 'px');
          p.style.color = Math.random() > 0.5 ? 'var(--gold)' : 'var(--accent)';
          document.body.appendChild(p);

          setTimeout((function (el) {
            return function () {
              if (el.parentNode) el.parentNode.removeChild(el);
            };
          })(p), 1600);
        }
      }

      function onSayAlhamdulillah(e) {
        gratitudeCount++;
        try {
          localStorage.setItem('heynuo-gratitude-count', String(gratitudeCount));
        } catch (err) { }

        var badge = document.getElementById('gratitudeCounter');
        if (badge) badge.textContent = gratitudeCount;

        var rect = e.currentTarget.getBoundingClientRect();
        var originX = rect.left + rect.width / 2;
        var originY = rect.top + rect.height / 2;
        spawnGratitudeParticle(originX, originY);

        if ('vibrate' in navigator) {
          try { navigator.vibrate(25); } catch (err) { }
        }

        if (isAudioActive) {
          var freqs = [432, 528, 648, 720];
          playSacredChime(freqs[gratitudeCount % freqs.length], 2.2);
        }
      }

      var alhamdulillahBtn = document.getElementById('sayAlhamdulillahBtn');
      var badge = document.getElementById('gratitudeCounter');
      if (badge) badge.textContent = gratitudeCount;
      if (alhamdulillahBtn) alhamdulillahBtn.addEventListener('click', onSayAlhamdulillah);

      // ── 5. Ambient Starfield Canvas (GPU throttled) ───────────
      var starsCanvas = document.getElementById('stars-canvas');
      var starsCtx = starsCanvas ? starsCanvas.getContext('2d') : null;
      var starsList = [];
      var starsAnimationId = null;
      var isVisible = true;

      function initStars() {
        if (!starsCanvas || !starsCtx || prefersReducedMotion.matches) return;
        var width = starsCanvas.width = window.innerWidth;
        var height = starsCanvas.height = window.innerHeight;
        var count = Math.min(width > 768 ? 45 : 25, 60);
        starsList = [];

        for (var i = 0; i < count; i++) {
          starsList.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.5 + 0.4,
            alpha: Math.random() * 0.7 + 0.2,
            speed: Math.random() * 0.3 + 0.1,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      function drawStars() {
        if (!starsCtx || prefersReducedMotion.matches || document.visibilityState === 'hidden' || !isVisible) {
          starsAnimationId = null;
          return;
        }
        starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
        var theme = document.documentElement.getAttribute('data-theme') || 'light';
        var starColor = theme === 'dark' ? '232, 196, 123' : '15, 118, 110';

        for (var i = 0; i < starsList.length; i++) {
          var s = starsList[i];
          s.phase += 0.02;
          s.y -= s.speed;
          if (s.y < 0) {
            s.y = starsCanvas.height;
            s.x = Math.random() * starsCanvas.width;
          }

          var pulse = Math.sin(s.phase) * 0.3 + 0.7;
          starsCtx.beginPath();
          starsCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          starsCtx.fillStyle = 'rgba(' + starColor + ', ' + (s.alpha * pulse) + ')';
          starsCtx.fill();
        }

        starsAnimationId = window.requestAnimationFrame(drawStars);
      }

      function startStars() {
        if (!starsAnimationId && isVisible && document.visibilityState !== 'hidden') {
          starsAnimationId = window.requestAnimationFrame(drawStars);
        }
      }

      function stopStars() {
        if (starsAnimationId) {
          window.cancelAnimationFrame(starsAnimationId);
          starsAnimationId = null;
        }
      }

      // ── 6. Fullscreen Toggle ─────────────────────────────────
      function toggleFullscreen() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          var el = document.documentElement;
          if (el.requestFullscreen) el.requestFullscreen();
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
      }

      // ── 7. Viewport Visibility & Lifecycle Management ────────
      if (isEmbedded) {
        try {
          if (window.parent && window.parent.IntersectionObserver && window.frameElement) {
            var frameObserver = new window.parent.IntersectionObserver(function (entries) {
              isVisible = entries.some(function (entry) { return entry.isIntersecting; });
              if (isVisible) startStars();
              else stopStars();
            }, { threshold: 0.05 });
            frameObserver.observe(window.frameElement);
          }
        } catch (e) {
          isVisible = true;
        }
      }

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          stopStars();
          if (isAudioActive) stopAmbientDrone();
        } else {
          if (isVisible) startStars();
          if (isAudioActive) startAmbientDrone();
        }
      });

      window.addEventListener('resize', function () {
        initStars();
      }, { passive: true });

      // ── 8. Controls & Keyboard Navigation ────────────────────
      var themeBtn = document.getElementById('themeToggleBtn');
      if (themeBtn) {
        themeBtn.addEventListener('click', function () {
          var cur = document.documentElement.getAttribute('data-theme') || 'light';
          var nextIdx = (VALID_THEMES.indexOf(cur) + 1) % VALID_THEMES.length;
          applyTheme(VALID_THEMES[nextIdx]);
        });
      }

      var audioBtn = document.getElementById('audioToggleBtn');
      if (audioBtn) audioBtn.addEventListener('click', toggleAudio);

      var fullscreenBtn = document.getElementById('fullscreenToggleBtn');
      if (fullscreenBtn) fullscreenBtn.addEventListener('click', toggleFullscreen);

      window.addEventListener('keydown', function (e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'a' || e.key === 'A') {
          if (alhamdulillahBtn) alhamdulillahBtn.click();
        } else if (e.key === 't' || e.key === 'T') {
          var cur = document.documentElement.getAttribute('data-theme') || 'light';
          var nextIdx = (VALID_THEMES.indexOf(cur) + 1) % VALID_THEMES.length;
          applyTheme(VALID_THEMES[nextIdx]);
        } else if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
        } else if (e.key === 'm' || e.key === 'M') {
          toggleAudio();
        }
      });

      // ── 9. Start ─────────────────────────────────────────────
      initStars();
      startStars();

    })();
  </script>
</body>

</html>
