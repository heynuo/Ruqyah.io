<style>
  :root {

  .lyric-current {

    line-height: 1.18; letter-spacing: -0.015em;

  .lyric-text-inner {

      transform: translateY(0) scale(1);
      filter: blur(0);
    }

  .dock-right {

    background: var(--cream); color: var(--ink);

  .scrubber-container {
    position: relative; flex: 1; display: flex; align-items: center;

  .chapter-track {
    position: absolute; left: 0; right: 0; top: 50%; height: 6px;
    transform: translateY(-50%);

  }
  .chapter-dot {
    position: absolute; top: 50%;
    transform: translate(-50%, -50%);
    width: 5px; height: 5px; border-radius: 50%;

  .chapter-dot.is-drop {
    background: var(--coral);

  .scrubber-tooltip {
    position: absolute; bottom: 32px; left: 0;
    transform: translateX(-50%);
    background: var(--ink); color: var(--butter);
    padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
    font-family: 'JetBrains Mono', monospace;

  input[type="range"] {

    background: transparent; cursor: pointer; --p: 0%;
    position: relative; z-index: 2;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 5px; border-radius: 999px;

    transition: background 0.05s linear;

  input[type="range"]::-moz-range-track {
    height: 5px; border-radius: 999px; background: rgba(255, 242, 222, 0.22);
  }
  input[type="range"]::-moz-range-progress {
    height: 5px; border-radius: 999px; background: var(--coral);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; margin-top: -4.5px; border-radius: 50%;
    background: var(--butter); border: 2px solid var(--ink);
    box-shadow: 0 0 0 3px rgba(255, 226, 154, 0.35), 0 0 16px rgba(255, 111, 97, 0.9);
    transition: transform 0.1s ease;

  input[type="range"]:hover::-webkit-slider-thumb {
    transform: scale(1.25);

  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;

    box-shadow: 0 0 0 3px rgba(255, 226, 154, 0.35), 0 0 16px rgba(255, 111, 97, 0.9);
  }

  /* Volume slider popover */
  .volume-wrap {
    position: relative; display: flex; align-items: center;
  }
  .volume-slider-box {

  }
  .volume-wrap:hover .volume-slider-box,
  .volume-wrap:focus-within .volume-slider-box {
    opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0);
  }
  .volume-slider-box input[type="range"] {
    writing-mode: vertical-lr; direction: rtl;

  .volume-percent {

  /* Accessibility & Media Queries */
  button:focus-visible, input:focus-visible {

  @media (max-width: 768px) {

  }
  @media (max-width: 480px) {

  }
  @media (prefers-reduced-motion: reduce) {
    .big-play-btn, .icon-btn, .lyric-current { transition: none !important; animation: none !important; }
  }
</style>

  /* Live Lyrics Synchronization */
  let activeLyricIdx = -2;
  function updateLyrics(curTime) {
    if (!LYRICS.length) return;
    let idx = -1;
    for (let i = 0; i < LYRICS.length; i++) {
      if (curTime >= LYRICS[i].t) idx = i;
      else break;
    }
    if (idx !== activeLyricIdx) {
      activeLyricIdx = idx;
      if (idx >= 0 && idx < LYRICS.length) {
        const item = LYRICS[idx];
        const prevItem = LYRICS[idx - 1];
        const nextItem = LYRICS[idx + 1];

        lyricPrev.textContent = item.text && prevItem ? prevItem.text : '';
        lyricNext.textContent = item.text && nextItem ? nextItem.text : '';

        lyricTextInner.textContent = item.text;
        lyricTextInner.classList.remove('animating');
        void lyricTextInner.offsetWidth; // Force CSS reflow
        lyricTextInner.classList.add('animating');
      } else {
        lyricPrev.textContent = '';
        lyricTextInner.textContent = '';
        lyricNext.textContent = '';
      }
    }
  }

  /* Play / Pause Toggle */
  async function togglePlay() {
    if (video.paused) {
      try {
        video.muted = false;
        await video.play();
      } catch (err) {
        console.warn('Play interrupted or blocked:', err);
      }
    } else {
      video.pause();
    }
  }

  function syncState() {
    const isPlaying = !video.paused && !video.ended;
    playBtn.dataset.state = isPlaying ? 'playing' : 'paused';
    playBtn.setAttribute('aria-label', isPlaying ? 'Pause [Space]' : 'Play [Space]');
    document.body.classList.toggle('playing', isPlaying);
    if ('mediaSession' in navigator) {
      navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
    }
  }

  playBtn.addEventListener('click', togglePlay);
  bigPlayBtn.addEventListener('click', e => {
    e.stopPropagation();
    togglePlay();
  });
  stage.addEventListener('click', e => {
    if (e.target.closest('.dock')) return;
    togglePlay();
  });

  video.addEventListener('play', syncState);
  video.addEventListener('pause', syncState);
  video.addEventListener('ended', () => {
    syncState();
    if (!video.loop) document.body.classList.remove('playing');
  });

  /* Seek Bar & Scrubbing */
  let dragging = false;
  seek.addEventListener('input', () => {
    dragging = true;
    if (video.duration) {
      const targetSec = (seek.value / 1000) * video.duration;
      video.currentTime = targetSec;
      curTimeEl.textContent = fmt(targetSec);
      seek.style.setProperty('--p', (seek.value / 10) + '%');
      updateLyrics(targetSec);
    }
  });
  seek.addEventListener('change', () => { dragging = false; });
  seek.addEventListener('pointerdown', () => { dragging = true; });
  seek.addEventListener('pointerup', () => { dragging = false; });

  /* Chapter Markers */
  function getCurrentChapterIdx(curTime) {
    let idx = 0;
    for (let i = 0; i < CHAPTERS.length; i++) {
      if (curTime >= CHAPTERS[i].t) idx = i; else break;
    }
    return idx;
  }

  function renderChapterMarkers() {
    const dur = video.duration || 183.47;
    chapterTrack.innerHTML = '';
    CHAPTERS.forEach(ch => {
      const pct = (ch.t / dur) * 100;
      if (pct < 0 || pct > 100) return;
      const dot = document.createElement('div');
      dot.className = 'chapter-dot' + (ch.isDrop ? ' is-drop' : '');
      dot.style.left = pct.toFixed(2) + '%';
      dot.title = ch.title;
      dot.addEventListener('click', e => {
        e.stopPropagation();
        video.currentTime = ch.t;
        if (video.paused) togglePlay();
      });
      chapterTrack.appendChild(dot);
    });
  }

  scrubberContainer.addEventListener('pointermove', e => {
    const rect = scrubberContainer.getBoundingClientRect();
    const ratio = clamp((e.clientX - rect.left) / rect.width);
    const hoverSec = ratio * (video.duration || 183.47);
    const chIdx = getCurrentChapterIdx(hoverSec);
    const ch = CHAPTERS[chIdx];
    scrubberTip.textContent = fmt(hoverSec) + (ch ? ' • ' + ch.title : '');
    scrubberTip.style.left = (ratio * 100).toFixed(1) + '%';
  });

  /* Volume & Mute Handling */
  let lastVolume = 1;
  function updateVolume(val) {
    val = clamp(val, 0, 1);
    video.volume = val;
    video.muted = (val === 0);
    volSlider.value = Math.round(val * 100);
    volLabel.textContent = Math.round(val * 100) + '%';
    volSlider.style.setProperty('--p', (val * 100) + '%');

    if (val === 0 || video.muted) {
      volIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
    } else if (val < 0.5) {
      volIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
    } else {
      volIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    }
  }

  volSlider.addEventListener('input', () => updateVolume(volSlider.value / 100));
  volBtn.addEventListener('click', () => {
    if (video.muted || video.volume === 0) {
      video.muted = false;
      updateVolume(lastVolume || 1);
    } else {
      lastVolume = video.volume;
      updateVolume(0);
    }
  });

  dock.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.05 : -0.05;
    updateVolume(video.volume + delta);
  }, { passive: false });

  /* Skip & Loop buttons */
  skipBackBtn.addEventListener('click', () => {
    video.currentTime = Math.max(0, video.currentTime - 10);
  });
  skipFwdBtn.addEventListener('click', () => {
    video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
  });
  loopBtn.addEventListener('click', () => {
    video.loop = !video.loop;
    loopBtn.classList.toggle('active', video.loop);
  });

  /* Fullscreen */
  fsBtn.addEventListener('click', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  });
  document.addEventListener('fullscreenchange', () => {
    fsBtn.classList.toggle('active', !!document.fullscreenElement);
  });

  /* Auto-hide dock when playing and idle */
  let idleTimer = null;
  function showDock() {
    dock.classList.remove('hidden');
    document.body.style.cursor = '';
    clearTimeout(idleTimer);
    if (!video.paused && !video.ended) {
      idleTimer = setTimeout(() => {
        dock.classList.add('hidden');
        document.body.style.cursor = 'none';
      }, 3000);
    }
  }
  window.addEventListener('pointermove', showDock);
  window.addEventListener('pointerdown', showDock);
  video.addEventListener('play', showDock);
  video.addEventListener('pause', () => {
    clearTimeout(idleTimer);
    dock.classList.remove('hidden');
    document.body.style.cursor = '';
  });

  /* Keyboard Shortcuts */
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const key = e.key.toLowerCase();
    if (e.code === 'Space' || key === 'k') {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      video.currentTime = Math.max(0, video.currentTime - 5);
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      video.currentTime = Math.min(video.duration || 0, video.currentTime + 5);
    } else if (key === 'j') {
      video.currentTime = Math.max(0, video.currentTime - 10);
    } else if (key === 'l') {
      video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
    } else if (e.code === 'ArrowUp') {
      e.preventDefault();
      updateVolume(video.volume + 0.08);
    } else if (e.code === 'ArrowDown') {
      e.preventDefault();
      updateVolume(video.volume - 0.08);
    } else if (key === 'm') {
      volBtn.click();
    } else if (key === 'f') {
      fsBtn.click();
    }
  });

  /* MediaSession API */
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'bye (Altare remix)',
      artist: 'Ariana Grande',
      album: 'eternal sunshine'
    });
    navigator.mediaSession.setActionHandler('play', togglePlay);
    navigator.mediaSession.setActionHandler('pause', togglePlay);
    navigator.mediaSession.setActionHandler('seekbackward', () => {
      video.currentTime = Math.max(0, video.currentTime - 10);
    });
    navigator.mediaSession.setActionHandler('seekforward', () => {
      video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
    });
    navigator.mediaSession.setActionHandler('seekto', details => {
      if (details.seekTime) video.currentTime = details.seekTime;
    });
  }

  /* Main animation loop */
  let lastSec = -1;
  function renderFrame() {
    const cur = video.currentTime || 0;
    const dur = video.duration || 183.47;
    const p = dur ? clamp(cur / dur) : 0;

    if (!dragging && dur) {
      seek.value = Math.round(p * 1000);
      seek.style.setProperty('--p', (p * 100).toFixed(2) + '%');
    }

    const sec = cur | 0;
    if (sec !== lastSec) {
      lastSec = sec;
      curTimeEl.textContent = fmt(cur);
      durTimeEl.textContent = fmt(dur);

      const curChIdx = getCurrentChapterIdx(cur);
      document.querySelectorAll('.chapter-dot').forEach((dot, dIdx) => {
        dot.classList.toggle('active', dIdx === curChIdx);
      });
    }

    updateLyrics(cur);
    requestAnimationFrame(renderFrame);
  }

  video.addEventListener('loadedmetadata', () => {
    durTimeEl.textContent = fmt(video.duration || 183.47);
    renderChapterMarkers();
    lastSec = -1;
  });
  video.addEventListener('timeupdate', () => updateLyrics(video.currentTime));
  video.addEventListener('seeked', () => updateLyrics(video.currentTime));

  renderChapterMarkers();
  requestAnimationFrame(renderFrame);
})();
