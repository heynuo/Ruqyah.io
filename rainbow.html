<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Color Scale Spectrum — Ruqyah</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='20'%20fill='%230b0f14'/%3E%3Crect%20x='15'%20y='40'%20width='70'%20height='20'%20rx='10'%20fill='url(%23g)'/%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='0'%3E%3Cstop%20offset='0%25'%20stop-color='%23ff0055'/%3E%3Cstop%20offset='35%25'%20stop-color='%23ffbb00'/%3E%3Cstop%20offset='70%25'%20stop-color='%2300ffcc'/%3E%3Cstop%20offset='100%25'%20stop-color='%237700ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --current-hue: 0deg;
      --active-color: #ff0055;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background: #06090e;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Ambient dynamic glow reflecting the active color */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(255, 0, 100, 0.12) 0%, rgba(0, 200, 255, 0.05) 45%, transparent 75%);
      transition: background 0.3s ease;
      z-index: 0;
    }

    /* Subtle technical grid background */
    .bg-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-size: 40px 40px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      z-index: 1;
    }

    /* Minimalist back navigation link */
    .back-nav {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 50;
      color: rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 7px 16px;
      border-radius: 9999px;
      font-size: 12.5px;
      font-weight: 500;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-nav:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      transform: translateX(-2px);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Main Container */
    .scale-card {
      position: relative;
      z-index: 10;
      width: calc(100% - 40px);
      max-width: 980px;
      padding: 40px 36px;
      background: rgba(13, 20, 29, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Header & HUD Readout */
    .scale-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 24px;
    }

    .scale-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .scale-kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #94a3b8;
    }

    .scale-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--active-color);
      box-shadow: 0 0 14px var(--active-color);
      display: inline-block;
      animation: dotPulse 1.5s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    /* Live Telemetry Display Cards */
    .scale-telemetry {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .telemetry-chip {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 90px;
    }

    .telemetry-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      color: #64748b;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .telemetry-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.04em;
    }

    /* ==========================================================================
       THE COLOR CHANGING STRIPE SCALE
       ========================================================================== */
    .scale-wrapper {
      position: relative;
      width: 100%;
      padding: 24px 0 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      cursor: crosshair;
    }

    /* Primary Color Changing Stripe */
    .scale-stripe {
      position: relative;
      width: 100%;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(
        90deg,
        #FF0055 0%,
        #FF5500 14%,
        #FFAA00 28%,
        #22DD55 42%,
        #00D4FF 56%,
        #3B82F6 70%,
        #8B5CF6 84%,
        #EC4899 94%,
        #FF0055 100%
      );
      background-size: 300% 100%;
      box-shadow: 0 12px 36px -8px rgba(0, 0, 0, 0.6), inset 0 2px 2px rgba(255, 255, 255, 0.4), inset 0 -2px 2px rgba(0, 0, 0, 0.3);
      animation: stripeFlow 7s linear infinite, stripeHueShift 14s ease-in-out infinite alternate;
      border: 1px solid rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    /* Animated continuous flow */
    @keyframes stripeFlow {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 300% 50%;
      }
    }

    /* Shifting hue over time */
    @keyframes stripeHueShift {
      0% {
        filter: hue-rotate(0deg) saturate(1.15) brightness(1.05);
      }
      50% {
        filter: hue-rotate(180deg) saturate(1.3) brightness(1.12);
      }
      100% {
        filter: hue-rotate(360deg) saturate(1.15) brightness(1.05);
      }
    }

    /* High-gloss prism glass reflection overlay */
    .scale-stripe::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.12) 40%,
        rgba(0, 0, 0, 0.05) 60%,
        rgba(0, 0, 0, 0.3) 100%
      );
      pointer-events: none;
    }

    /* Laser Scanning Needle / Cursor */
    .scale-cursor {
      position: absolute;
      top: -10px;
      bottom: -10px;
      left: 50%;
      width: 3px;
      background: #ffffff;
      border-radius: 9999px;
      box-shadow: 0 0 16px 3px #ffffff, 0 0 30px 8px var(--active-color);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 5;
      transition: left 0.04s ease-out;
    }

    .scale-cursor::before,
    .scale-cursor::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
    }

    .scale-cursor::before {
      top: -10px;
      border-top: 8px solid #ffffff;
      filter: drop-shadow(0 0 6px var(--active-color));
    }

    .scale-cursor::after {
      bottom: -10px;
      border-bottom: 8px solid #ffffff;
      filter: drop-shadow(0 0 6px var(--active-color));
    }

    /* Scale Ticks Ruler (Major, Medium & Micro Markings) */
    .scale-ruler {
      position: relative;
      width: 100%;
      height: 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 4px;
    }

    .scale-tick-track {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 14px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .tick {
      width: 1px;
      height: 6px;
      background: rgba(255, 255, 255, 0.22);
    }

    .tick.medium {
      height: 10px;
      background: rgba(255, 255, 255, 0.45);
    }

    .tick.major {
      height: 14px;
      width: 1.5px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.4);
    }

    /* Scale Number Labels */
    .scale-labels {
      position: absolute;
      top: 18px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }

    /* Underglow Beam Mirroring the Stripe */
    .stripe-glow {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: -15px;
      height: 30px;
      background: linear-gradient(
        90deg,
        #FF0055, #FFAA00, #22DD55, #00D4FF, #3B82F6, #8B5CF6, #FF0055
      );
      background-size: 300% 100%;
      animation: stripeFlow 7s linear infinite, stripeHueShift 14s ease-in-out infinite alternate;
      filter: blur(28px);
      opacity: 0.65;
      pointer-events: none;
      z-index: -1;
    }

    /* Interactive Controls Toolbar */
    .scale-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 7px 15px;
      border-radius: 10px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .ctrl-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-color: var(--active-color);
      box-shadow: 0 0 14px -3px var(--active-color);
    }

    /* Speed Slider */
    .speed-slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #94a3b8;
    }

    .speed-slider {
      -webkit-appearance: none;
      width: 100px;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      outline: none;
      cursor: pointer;
    }

    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--active-color);
      box-shadow: 0 0 8px var(--active-color);
      cursor: pointer;
      border: 2px solid #ffffff;
    }

    footer.site-footer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 980px;
      padding: 16px 20px 24px;
      margin-top: 16px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    footer.site-footer a {
      color: #94a3b8;
      text-decoration: none;
      margin-left: 14px;
      transition: color 0.2s ease;
    }

    footer.site-footer a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .scale-card {
        padding: 26px 20px;
        width: calc(100% - 24px);
        border-radius: 20px;
      }
      .scale-stripe {
        height: 40px;
      }
      .scale-title {
        font-size: 19px;
      }
      .telemetry-chip {
        min-width: 75px;
        padding: 6px 10px;
      }
      .telemetry-value {
        font-size: 12px;
      }
      .scale-labels {
        font-size: 9px;
      }
    }
  </style>
</head>
<body>

  <!-- Minimalist Back Navigation -->
  <a href="index.html" class="back-nav" aria-label="Return to archive">← Archive</a>

  <!-- Dynamic Ambient Backlighting -->
  <div id="ambientGlow" class="ambient-glow" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- Main Scale Card Container -->
  <main class="scale-card" role="region" aria-label="Chromatic Color Changing Stripe Scale">
    <!-- Header with Telemetry Readout -->
    <header class="scale-header">
      <div class="scale-title-wrap">
        <span class="scale-kicker">Wavelength Spectrometry • Optical Scale</span>
        <h1 class="scale-title">
          <span id="liveDot" class="live-dot" aria-hidden="true"></span>

        </h1>
      </div>

      <!-- Telemetry Readouts -->
      <div class="scale-telemetry">
        <div class="telemetry-chip">
          <span class="telemetry-label">HEX</span>
          <span id="readoutHex" class="telemetry-value">#FF0055</span>
        </div>
        <div class="telemetry-chip">
          <span class="telemetry-label">WAVELENGTH</span>
          <span id="readoutWavelength" class="telemetry-value">685 nm</span>
        </div>
        <div class="telemetry-chip">
          <span class="telemetry-label">FREQUENCY</span>
          <span id="readoutFreq" class="telemetry-value">438 THz</span>
        </div>
        <div class="telemetry-chip">
          <span class="telemetry-label">SCALE %</span>

        </div>
      </div>
    </header>

    <!-- The Color Changing Stripe & Scale -->
    <div id="scaleWrapper" class="scale-wrapper" title="Drag or hover to calibrate scale">
      <!-- Glow Reflector Under Stripe -->
      <div id="stripeGlow" class="stripe-glow" aria-hidden="true"></div>

      <!-- The Flowing Animated Color Stripe -->
      <div id="scaleStripe" class="scale-stripe"></div>

      <!-- Laser Scanner Cursor / Needle -->
      <div id="scaleCursor" class="scale-cursor" aria-hidden="true"></div>

      <!-- Precision Scale Ruler (Graduated Ticks) -->
      <div class="scale-ruler" aria-hidden="true">
        <div id="tickTrack" class="scale-tick-track"></div>
        <div class="scale-labels">
          <span>380nm</span>
          <span>440nm</span>
          <span>500nm</span>
          <span>560nm</span>
          <span>620nm</span>
          <span>680nm</span>
          <span>750nm</span>
        </div>
      </div>
    </div>

    <!-- Interactive Mode & Velocity Toolbar -->
    <div class="scale-controls">
      <div class="control-group">
        <button id="btnAutoScan" type="button" class="ctrl-btn active" aria-pressed="true">
          <span>⚡ Auto-Scan</span>
        </button>
        <button id="btnLaserLock" type="button" class="ctrl-btn" aria-pressed="false">
          <span>🎯 Center Lock</span>
        </button>
        <button id="btnHueShift" type="button" class="ctrl-btn active" aria-pressed="true">
          <span>🌈 Hue Shift</span>
        </button>
      </div>

      <div class="speed-slider-wrap">
        <span>FLOW SPEED</span>
        <input id="speedRange" type="range" class="speed-slider" min="1" max="15" value="7" aria-label="Adjust stripe animation flow speed" />
      </div>
    </div>
  </main>

  <!-- Site Footer for Standards & Navigation -->
  <footer class="site-footer">
    <span>&copy; Ruqyah &bull; Chromatic Scale</span>
    <nav aria-label="Footer links">
      <a href="privacy.html">Privacy</a>
      <a href="rss.xml">RSS</a>
      <a href="end.html">The End</a>
    </nav>
  </footer>

  <!-- Interactive Scale Engine -->
  <script>
    (function () {
      'use strict';

      // ── DOM References ───────────────────────────────────────────────────
      const scaleWrapper = document.getElementById('scaleWrapper');
      const scaleStripe = document.getElementById('scaleStripe');
      const stripeGlow = document.getElementById('stripeGlow');
      const scaleCursor = document.getElementById('scaleCursor');
      const tickTrack = document.getElementById('tickTrack');
      const ambientGlow = document.getElementById('ambientGlow');
      const liveDot = document.getElementById('liveDot');

      // Readouts
      const readoutHex = document.getElementById('readoutHex');
      const readoutWavelength = document.getElementById('readoutWavelength');
      const readoutFreq = document.getElementById('readoutFreq');
      const readoutPercent = document.getElementById('readoutPercent');

      // Controls
      const btnAutoScan = document.getElementById('btnAutoScan');
      const btnLaserLock = document.getElementById('btnLaserLock');
      const btnHueShift = document.getElementById('btnHueShift');
      const speedRange = document.getElementById('speedRange');

      // ── Generate Ruler Ticks ─────────────────────────────────────────────
      const totalTicks = 81;
      let tickHtml = '';
      for (let i = 0; i < totalTicks; i++) {
        if (i % 10 === 0) {
          tickHtml += '<div class="tick major"></div>';
        } else if (i % 5 === 0) {
          tickHtml += '<div class="tick medium"></div>';
        } else {
          tickHtml += '<div class="tick"></div>';
        }
      }
      tickTrack.innerHTML = tickHtml;

      // ── Runtime State ────────────────────────────────────────────────────
      let isAutoScanning = true;
      let isDragging = false;
      let currentProgress = 0.5; // 0 to 1 along scale
      let scanSpeed = 0.0035;
      let scanDirection = 1;

      // ── Color Spectrum Map Function ──────────────────────────────────────
      // Converts progress (0 to 1) into wavelength (380nm to 750nm) and RGB/Hex
      function wavelengthToRgb(wavelength) {
        let r = 0, g = 0, b = 0;

        if (wavelength >= 380 && wavelength < 440) {
          r = -(wavelength - 440) / (440 - 380);
          g = 0;
          b = 1;
        } else if (wavelength >= 440 && wavelength < 490) {
          r = 0;
          g = (wavelength - 440) / (490 - 440);
          b = 1;
        } else if (wavelength >= 490 && wavelength < 510) {
          r = 0;
          g = 1;
          b = -(wavelength - 510) / (510 - 490);
        } else if (wavelength >= 510 && wavelength < 580) {
          r = (wavelength - 510) / (580 - 510);
          g = 1;
          b = 0;
        } else if (wavelength >= 580 && wavelength < 645) {
          r = 1;
          g = -(wavelength - 645) / (645 - 580);
          b = 0;
        } else if (wavelength >= 645 && wavelength <= 750) {
          r = 1;
          g = 0;
          b = 0;
        }

        // Intensity fall-off at limits of vision
        let factor = 1;
        if (wavelength >= 380 && wavelength < 420) {
          factor = 0.3 + 0.7 * (wavelength - 380) / (420 - 380);
        } else if (wavelength >= 700 && wavelength <= 750) {
          factor = 0.3 + 0.7 * (750 - wavelength) / (750 - 700);
        }

        const red = Math.round(r * factor * 255);
        const green = Math.round(g * factor * 255);
        const blue = Math.round(b * factor * 255);

        const hex = '#' + [red, green, blue].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
        return { red, green, blue, hex };
      }

      function updateScale(progress) {
        currentProgress = Math.max(0, Math.min(1, progress));

        // Position Cursor
        const percent = (currentProgress * 100).toFixed(1);
        scaleCursor.style.left = `${percent}%`;

        // Calculate Physics Wavelength (380nm to 750nm)
        const wavelength = Math.round(380 + currentProgress * (750 - 380));
        const color = wavelengthToRgb(wavelength);

        // Approximate Optical Frequency: f = c / lambda (speed of light 3e8 m/s)
        const frequencyTHz = Math.round(299792 / wavelength);

        // Update Readouts
        readoutHex.textContent = color.hex;
        readoutWavelength.textContent = `${wavelength} nm`;
        readoutFreq.textContent = `${frequencyTHz} THz`;
        readoutPercent.textContent = `${percent}%`;

        // Update CSS Variables & Ambient Reflections
        document.documentElement.style.setProperty('--active-color', color.hex);
        ambientGlow.style.background = `radial-gradient(circle at 50% 50%, rgba(${color.red}, ${color.green}, ${color.blue}, 0.16) 0%, rgba(${color.red}, ${color.green}, ${color.blue}, 0.05) 50%, transparent 75%)`;
      }

      // ── Animation Loop for Auto-Scan ─────────────────────────────────────
      function loop() {
        if (isAutoScanning && !isDragging) {
          currentProgress += scanSpeed * scanDirection;
          if (currentProgress >= 1) {
            currentProgress = 1;
            scanDirection = -1;
          } else if (currentProgress <= 0) {
            currentProgress = 0;
            scanDirection = 1;
          }
          updateScale(currentProgress);
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      // ── Pointer & Drag Interactions ──────────────────────────────────────
      function handlePointerPosition(e) {
        const rect = scaleWrapper.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const relativeX = clientX - rect.left;
        const progress = relativeX / rect.width;
        updateScale(progress);
      }

      scaleWrapper.addEventListener('pointerdown', (e) => {
        isDragging = true;
        handlePointerPosition(e);
        scaleWrapper.setPointerCapture(e.pointerId);
      });

      scaleWrapper.addEventListener('pointermove', (e) => {
        if (isDragging) {
          handlePointerPosition(e);
        }
      });

      scaleWrapper.addEventListener('pointerup', (e) => {
        isDragging = false;
        try { scaleWrapper.releasePointerCapture(e.pointerId); } catch (_) {}
      });

      scaleWrapper.addEventListener('pointercancel', () => {
        isDragging = false;
      });

      // ── Control Toolbar Buttons ──────────────────────────────────────────
      btnAutoScan.addEventListener('click', () => {
        isAutoScanning = !isAutoScanning;
        btnAutoScan.classList.toggle('active', isAutoScanning);
        btnAutoScan.setAttribute('aria-pressed', String(isAutoScanning));
      });

      btnLaserLock.addEventListener('click', () => {
        isAutoScanning = false;
        btnAutoScan.classList.remove('active');
        btnAutoScan.setAttribute('aria-pressed', 'false');
        updateScale(0.5);
      });

      let hueShiftActive = true;
      btnHueShift.addEventListener('click', () => {
        hueShiftActive = !hueShiftActive;
        btnHueShift.classList.toggle('active', hueShiftActive);
        btnHueShift.setAttribute('aria-pressed', String(hueShiftActive));
        scaleStripe.style.animation = hueShiftActive
          ? `stripeFlow ${16 - speedRange.value}s linear infinite, stripeHueShift 14s ease-in-out infinite alternate`
          : `stripeFlow ${16 - speedRange.value}s linear infinite`;
        stripeGlow.style.animation = scaleStripe.style.animation;
      });

      speedRange.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        scanSpeed = 0.0008 * val;
        const flowDuration = Math.max(2, 17 - val);
        scaleStripe.style.animationDuration = `${flowDuration}s, 14s`;
        stripeGlow.style.animationDuration = `${flowDuration}s, 14s`;
      });

      // Initial Call
      updateScale(0.5);
    })();
  </script>
</body>
</html>
